<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="script.js" defer></script>
     <link rel="stylesheet" href="styles.css">
</head>
<body>
    <button id="play">Play</button>
    <button id="insert-chords-btn">Insert Chords</button>

    <div class="modal" id="insert-chords-modal">
        <div>
            <svg width="150" height="50" id="svg-container">
                <!-- horizontal line-->
                <line x1="0" y1="0" x2="150" y2="0" style="stroke:black; stroke-width:1" id="E-tab">E</line>   
                <line x1="0" y1="10" x2="150" y2="10" style="stroke:black; stroke-width:1" id="A-tab">A</line>
                <line x1="0" y1="20" x2="150" y2="20" style="stroke:black; stroke-width:1" id="D-tab"></line>
                <line x1="0" y1="30" x2="150" y2="30" style="stroke:black; stroke-width:1" id="G-tab">G</line>
                <line x1="0" y1="40" x2="150" y2="40" style="stroke:black; stroke-width:1" id="B-tab">B</line>
                <line x1="0" y1="50" x2="150" y2="50" style="stroke:black; stroke-width:2" id="E6-tab">E</line>

                <!-- vertical line -->
                <line x1="150" y1="0" x2="150" y2="50" style="stroke:black; stroke-width:1">G</line> //edge
                <line x1="113" y1="0" x2="113" y2="50" style="stroke:black; stroke-width:1" id="first-fret"></line>
                <line x1="76" y1="0" x2="76" y2="50" style="stroke:black; stroke-width:1">G</line>
                <line x1="37" y1="0" x2="37" y2="50" style="stroke:black; stroke-width:1">G</line>
                <line x1="0" y1="0" x2="0" y2="50" style="stroke:black; stroke-width:1">G</line>
                
            </svg>
        </div>  
    </div>

</body>
</html>
